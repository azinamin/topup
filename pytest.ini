[pytest]
addopts =
    --browser chromium
    --headed
    --slowmo 300
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output reports/artifacts
    --html=reports/index.html
    --self-contained-html
bdd_features_base_dir = features/
testpaths = tests
markers =
    topup: تست‌های خرید شارژ
    e2e: سناریوی اصلی (اجباری)
    smoke: مسیر حیاتی
    regression: تست‌های رگرسیون
    real: روی پاسخ واقعی سرور اجرا می‌شود
    mocked: پاسخ API با page.route شبیه‌سازی می‌شود (تراکنش واقعی ندارد)
    no_auth: بدون لاگین ذخیره‌شده شروع می‌شود
